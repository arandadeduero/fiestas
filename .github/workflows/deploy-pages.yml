name: Deploy Pages

on:
  push:
    branches:
      - master
      - main
      - aranda
  schedule:
    - cron: "0 20 3-12 9 *"
  workflow_dispatch:
    inputs:
      daily_date:
        description: "Fecha a regenerar (opcional; se publican también las demás fechas)"
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication-window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Check 2026 publication window
        id: window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_date="$(date -u +%F)"
          if [[ "$current_date" > "2026-09-01" && "$current_date" < "2026-09-25" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: publication-window
    if: needs.publication-window.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/aranda' )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/aranda'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
